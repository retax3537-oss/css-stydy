<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국내 주식 동향 - KOR STOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        
        /* 한국 주식 시장 색상 (상승: 빨강, 하락: 파랑) */
        .text-up { color: #e11d48; }
        .text-down { color: #2563eb; }
        .bg-up { background-color: #e11d48; }
        .bg-down { background-color: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- 상단 네비게이션 바 -->
    <header class="flex justify-between items-center px-8 py-4 bg-white border-b sticky top-0 z-10">
        <div class="flex items-center gap-2 cursor-pointer" onclick="showList()">
            <div class="w-8 h-8 bg-blue-600 rounded-sm transform rotate-45 flex items-center justify-center">
                <div class="w-4 h-4 bg-white rounded-full"></div>
            </div>
            <span class="text-xl font-extrabold text-blue-600 ml-2">KOR STOCK</span>
        </div>
        <nav class="space-x-6 text-sm font-bold text-gray-500">
            <a href="#" class="hover:text-black" onclick="showList()">Home</a>
            <a href="#" class="text-black border-b-2 border-red-600 pb-1" onclick="showList()">주식목록</a>
        </nav>
    </header>

    <!-- 화면이 바뀌는 메인 영역 -->
    <main id="app" class="pb-24"></main>

    <script>
        // 최근 장세와 비슷한 현실적인 가상 데이터 및 기업 공식 로고 적용
        const kospi = { index: '2,580.32', change: '10.21', percent: '-0.39%', isUp: false };
        
        const stocks = [
            { id: 1, name: '삼성전자', price: '57,300', change: '1,200', percent: '-2.05%', isUp: false, img: 'https://upload.wikimedia.org/wikipedia/commons/2/24/Samsung_Logo.svg', desc: '대한민국을 대표하는 글로벌 IT 기업. 스마트폰, 반도체, 가전제품 등을 주력으로 하며 코스피 시가총액 1위 기업입니다. 배당 투자자들에게도 인기가 많습니다.', tags: '#반도체 #대장주 #배당' },
            { id: 2, name: 'SK하이닉스', price: '190,500', change: '4,500', percent: '+2.42%', isUp: true, img: 'https://upload.wikimedia.org/wikipedia/commons/a/a7/SK_hynix_Inc._logo.svg', desc: '글로벌 메모리 반도체 시장을 선도하는 기업. D램과 낸드플래시가 주력이며 최근 AI 관련 HBM 메모리로 크게 주목받고 있습니다.', tags: '#반도체 #HBM #AI관련주' },
            { id: 3, name: '현대차', price: '210,500', change: '2,000', percent: '+0.96%', isUp: true, img: 'https://upload.wikimedia.org/wikipedia/commons/4/44/Hyundai_Motor_Company_logo.svg', desc: '글로벌 자동차 제조사. 최근 전기차(EV) 및 수소차 시장에서 강세를 보이며 북미 시장에서 높은 판매량을 기록 중입니다.', tags: '#자동차 #전기차 #수출주' },
            { id: 4, name: 'NAVER', price: '172,000', change: '1,500', percent: '-0.86%', isUp: false, img: 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Naver_logotype.svg', desc: '대한민국 최대의 인터넷 검색 포털 사이트 운영 및 플랫폼 사업자. 커머스, 웹툰, 클라우드 등 다양한 사업을 전개하고 있습니다.', tags: '#플랫폼 #IT #포털' },
            { id: 5, name: '카카오', price: '37,200', change: '300', percent: '-0.80%', isUp: false, img: 'https://upload.wikimedia.org/wikipedia/commons/e/e3/Kakao_logo.svg', desc: '국민 메신저 카카오톡을 기반으로 한 플랫폼 기업. 금융, 모빌리티, 게임 등 일상생활 전반에 걸친 서비스를 제공합니다.', tags: '#플랫폼 #메신저 #국민주' },
            { id: 6, name: 'LG에너지솔루션', price: '412,000', change: '8,000', percent: '+1.98%', isUp: true, img: 'https://upload.wikimedia.org/wikipedia/commons/b/bf/LG_Energy_Solution_logo.svg', desc: '세계 최고 수준의 배터리 기술력을 갖춘 2차전지 제조 기업. 글로벌 완성차 업체들에 배터리를 공급합니다.', tags: '#2차전지 #배터리 #전기차' },
            { id: 7, name: '셀트리온', price: '181,000', change: '0', percent: '0.00%', isUp: null, img: 'https://upload.wikimedia.org/wikipedia/commons/3/36/Celltrion_logo.svg', desc: '바이오시밀러(바이오의약품 복제약) 개발을 선도하는 글로벌 종합 생명공학 기업입니다.', tags: '#바이오 #제약 #바이오시밀러' },
            { id: 8, name: 'POSCO홀딩스', price: '332,000', change: '4,500', percent: '-1.34%', isUp: false, img: 'https://upload.wikimedia.org/wikipedia/commons/9/91/POSCO_logo.svg', desc: '철강 사업을 기반으로 2차전지 소재, 리튬 등 친환경 미래 소재 전문 기업으로 도약하고 있습니다.', tags: '#철강 #2차전지소재 #리튬' }
        ];

        const app = document.getElementById('app');

        function showList() {
            const kospiColor = kospi.isUp ? 'text-up' : 'text-down';
            const kospiArrow = kospi.isUp ? '▲' : '▼';

            let html = `
                <div class="flex justify-center items-center py-12 bg-white mb-10 border-b shadow-sm">
                    <div class="text-center">
                        <p class="text-sm font-bold text-gray-500 mb-1">현재 코스피 지수</p>
                        <h2 class="text-4xl font-extrabold mb-2">${kospi.index}</h2>
                        <div class="text-lg font-bold ${kospiColor}">
                            ${kospiArrow} ${kospi.change} (${kospi.percent})
                        </div>
                    </div>
                </div>

                <div class="max-w-6xl mx-auto px-6">
                    <h3 class="text-center text-xl font-extrabold mb-10 border-b-2 border-gray-800 pb-4 max-w-xs mx-auto">주요 우량주</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12">
            `;

            stocks.forEach(stock => {
                const colorClass = stock.isUp === true ? 'text-up' : (stock.isUp === false ? 'text-down' : 'text-gray-500');
                const arrow = stock.isUp === true ? '▲' : (stock.isUp === false ? '▼' : '-');
                const badge = stock.isUp ? '<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-sm ml-2">상승장</span>' : '';
                
                html += `
                    <div class="cursor-pointer group" onclick="showDetail(${stock.id})">
                        <!-- 로고 이미지가 잘 보이도록 배경 흰색, 패딩 추가, object-contain 적용 -->
                        <div class="bg-white border border-gray-100 rounded-lg shadow-sm mb-4 h-48 flex items-center justify-center p-8">
                            <img src="${stock.img}" alt="${stock.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
                        </div>
                        <h4 class="text-lg font-extrabold mb-1 flex items-center">${stock.name} ${badge}</h4>
                        <div class="text-lg font-bold mb-2 ${colorClass}">
                            ${stock.price}원 <span class="text-sm ml-1">${arrow} ${stock.change}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-2">${stock.tags.split(' ').join(' ')}</p>
                        <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed">
                            ${stock.desc}
                        </p>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;
            app.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function showDetail(id) {
            const stock = stocks.find(s => s.id === id);
            if (!stock) return;

            const colorClass = stock.isUp === true ? 'text-up' : (stock.isUp === false ? 'text-down' : 'text-gray-500');
            const arrow = stock.isUp === true ? '▲' : (stock.isUp === false ? '▼' : '-');

            app.innerHTML = `
                <div class="max-w-5xl mx-auto px-6 py-16 flex flex-col md:flex-row gap-12">
                    <div class="w-full md:w-[50%] bg-white border border-gray-100 rounded-xl shadow-sm h-[350px] flex items-center justify-center p-12">
                        <img src="${stock.img}" alt="${stock.name}" class="w-full h-full object-contain">
                    </div>
                    
                    <div class="w-full md:w-[50%] flex flex-col pt-4">
                        <div class="text-sm font-bold text-gray-400 mb-2 uppercase tracking-wide">KOSPI 200</div>
                        <h2 class="text-3xl font-extrabold mb-6">${stock.name}</h2>
                        
                        <div class="text-2xl font-bold mb-8 ${colorClass}">
                            <span class="text-gray-800 text-lg mr-2">현재가</span> ${stock.price}원
                            <span class="text-base font-semibold ml-2">${arrow} ${stock.change} (${stock.percent})</span>
                        </div>
                        
                        <div class="border-t border-gray-200 pt-6 mb-8">
                            <p class="text-gray-600 leading-relaxed text-sm">
                                ${stock.desc}
                            </p>
                        </div>
                        
                        <div class="mb-10">
                            <h4 class="font-bold text-sm mb-3">종목 특징</h4>
                            <div class="text-xs text-gray-500 space-y-2">
                                <p>• 국내 주요 우량주</p>
                                <p>• 관련 테마: <span class="font-semibold">${stock.tags}</span></p>
                            </div>
                        </div>
                        
                        <div class="mt-auto">
                            <button onclick="showList()" class="bg-[#005c97] hover:bg-[#004a7c] text-white text-sm font-bold py-3.5 px-8 rounded-full transition-colors shadow-md w-max">
                                ← 메뉴로 돌아가기
                            </button>
                        </div>
                    </div>
                </div>
            `;
            window.scrollTo(0, 0);
        }

        showList();
    </script>
</body>
</html>
