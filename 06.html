<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5주차 예제 6 · form button 타입 비교</title>
  <style>
    /* Mac 환경과 잘 어울리는 깔끔한 폰트와 배경 설정 */
    body {
      background-color: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 벤토 그리드 느낌의 카드 UI */
    .bento-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      width: 320px;
    }

    h2 {
      margin-top: 0;
      color: #2f3542;
    }

    .dev-info {
      font-size: 0.85rem;
      color: #747d8c;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f1f2f6;
    }

    /* 입력 폼 스타일링 */
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      color: #57606f;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #dfe4ea;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    /* 버튼 공통 스타일 및 개별 색상 부여 */
    button {
      width: 100%;
      padding: 14px;
      margin-top: 5px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s; /* 호버 시 부드러운 전환 효과 */
    }

    /* 제출(submit) 역할을 하는 메인 버튼 */
    .btn-submit {
      background-color: #ff4757;
      color: white;
    }
    
    .btn-submit:hover {
      background-color: #ff6b81;
    }

    /* 계산(button) 역할을 하는 서브 버튼 */
    .btn-calc {
      background-color: #f1f2f6;
      color: #2f3542;
    }

    .btn-calc:hover {
      background-color: #dfe4ea;
    }
  </style>
</head>
<body>
  
  <div class="bento-card">
    <h2>🍚 밥고리즘</h2>
    <div class="dev-info">👨‍💻 한신대 AI SW학 이주현 님의 프로토타입</div>
    
    <form>
      <label for="menu">오늘의 직접 요리 메뉴</label>
      <input type="text" id="menu" value="우삼겹 알리오올리오 파스타" />
      
      <label for="sweetener">단맛 추가 (선택)</label>
      <input type="text" id="sweetener" value="액상 알룰로스" />

      <!-- type 생략 = submit. 폼 데이터를 서버로 전송하고 새로고침 발생 -->
      <button class="btn-submit">메뉴 확정하기</button>
      
      <!-- type="button". 새로고침 없이 자바스크립트용으로 사용됨 -->
      <button type="button" class="btn-calc">조리 시간 계산</button>
    </form>
  </div>

</body>
</html>
